name: plugin

on:
  pull_request:

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version bumped when plugin files change
        run: scripts/check-version.sh "origin/${{ github.base_ref }}"

  inspect-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Inspect and Build scripts, and the role guard
        run: node --test 'plugin/skills/inspect/scripts/*.test.mjs' 'plugin/skills/build/scripts/*.test.mjs' plugin/hooks/role-guard.test.mjs
